name: Test Build Release

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # Allow manual trigger

env:
  BUILD_TYPE: Release
  VCPKG_COMMIT: "2023.09.22"  # Lock vcpkg version for consistency

jobs:
  build-rootd:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build
        sudo apt-get install -y libspdlog-dev nlohmann-json3-dev

    - name: Configure vcpkg
      run: |
        git clone https://github.com/Microsoft/vcpkg.git
        cd vcpkg
        git checkout ${{ env.VCPKG_COMMIT }}
        ./bootstrap-vcpkg.sh
        ./vcpkg integrate install

    - name: Configure CMake
      run: |
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_TOOLCHAIN_FILE=./vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}

    - name: Run Tests
      working-directory: build
      run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

    - name: Package rootd
      run: |
        cd build
        cpack -G ZIP
        mv OpenRoot-*.zip OpenRoot-rootd-linux.zip

    - name: Upload rootd artifact
      uses: actions/upload-artifact@v3
      with:
        name: rootd-linux
        path: build/OpenRoot-rootd-linux.zip

  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v2

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x droid-chan/gradlew

    - name: Build APK
      run: |
        cd droid-chan
        ./gradlew assembleDebug

    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: droid-chan/app/build/outputs/apk/debug
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Upload APK artifact
      uses: actions/upload-artifact@v3
      with:
        name: droid-chan-debug
        path: droid-chan/app/build/outputs/apk/debug/*.apk

  create-release:
    needs: [build-rootd, build-android]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    steps:
    - uses: actions/download-artifact@v3

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: nightly-${{ steps.date.outputs.date }}
        name: Test Build ${{ steps.date.outputs.date }}
        body: |
          🧪 Automated test build from ${{ github.ref_name }} branch
          
          **Warning**: This is an automated test build and may be unstable.
          
          Build triggered by: ${{ github.event.head_commit.message }}
          Commit: ${{ github.sha }}
          
          ## Downloads
          - rootd daemon (Linux)
          - Droid-Chan APK (Android)
          
          ## Known Issues
          - This is a test build, use at your own risk
          - Some features may be incomplete or unstable
        files: |
          rootd-linux/*.zip
          droid-chan-debug/*.apk
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}